<div>
  <button class="btn btn-primary" (click)="goBack()">
    <span class="glyphicon glyphicon-arrow-left"></span>
    <span> Back</span>
  </button>
</div>
<app-linelist-loading-overlay
  *ngIf="isLoading"
  title="DPR patient list"
  [statusText]="loadingStatus"
  [progress]="loadingProgress"
  note="Estimated progress - the list is built on the server in one step."
></app-linelist-loading-overlay>
<h3>DPR patient list</h3>
<hr />

<div *ngIf="hasError">
  <p class="alert-error alert">
    Error loading patient list. <small>{{ errorMessage }}</small>
  </p>
</div>

<div *ngIf="!isLoading && !hasError">
  <div class="dpr-toolbar">
    <div class="dpr-summary">
      <p class="bg-info" style="padding: 4px; margin: 0">
        <b>
          <span style="color: green" class="glyphicon glyphicon-ok"
            >All records loaded {{ '[ ' + rowData.length + ' ]' }}</span
          ></b
        >
      </p>
      <div class="dpr-cohort-note">{{ cohortNote }}</div>
    </div>
    <button
      class="btn btn-info"
      [disabled]="rowData.length === 0"
      (click)="exportToCsv()"
      style="color: #fff"
    >
      <i class="fa fa-file-excel-o"></i> Export CSV
    </button>
  </div>

  <ag-grid-angular
    style="width: 100%; height: 600px"
    class="ag-blue"
    [gridOptions]="gridOptions"
    [columnDefs]="columnDefs"
    [rowData]="rowData"
  >
  </ag-grid-angular>
</div>
