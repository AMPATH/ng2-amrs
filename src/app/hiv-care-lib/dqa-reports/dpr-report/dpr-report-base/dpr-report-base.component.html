<h4 class="component-title text-success">
  <span class="fa fa-pie-chart"></span>DPR Report
</h4>
<div class="dpr-intro">
  <p class="dpr-intro-title">
    Line list of Recipients of Care who started ART in the selected period, with
    their care status at 6, 12 and 24 months
  </p>
  <ul class="dpr-intro-list">
    <li>
      <span class="dpr-intro-label">12-month cohort</span>
      Started ART between the selected start and end dates
    </li>
    <li>
      <span class="dpr-intro-label">24-month cohort</span>
      Started ART in the same period, one year earlier
    </li>
  </ul>
</div>

<report-filters
  [enabledControls]="enabledControls"
  [(startDate)]="startDate"
  [(endDate)]="endDate"
  (generateReport)="generateReport()"
>
</report-filters>
